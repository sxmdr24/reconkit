name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The project is stdlib-only; pytest is the only dependency.
      # nmap is deliberately not installed: tests never call it and never use the network.
      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v
